# Render's free web services go to sleep after 15 minutes without a visit and take about a minute to wake. This job visits the site
# every 10 minutes so a visitor never meets the sleeping version. Change the address by setting the repository variable SITE_URL
# (GitHub: Settings -> Secrets and variables -> Actions -> Variables) if Render gave the service a different name.
# One free service awake all month is 744 of Render's 750 free hours, so keep it the only free service in the workspace.
name: keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the health endpoint (a sleeping service can take about a minute to answer)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://quantum-inspired-route-optimizer.onrender.com' }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 -o /dev/null -w "attempt $attempt: HTTP %{http_code} in %{time_total}s\n" "$SITE_URL/health"; then exit 0; fi
            sleep 20
          done
          echo "the site did not answer" && exit 1
