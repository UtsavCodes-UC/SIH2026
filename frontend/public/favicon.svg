<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QuantumRoute">
  <defs>
    <linearGradient id="qr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc4a5f" />
      <stop offset="1" stop-color="#8f2233" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#qr-bg)" />
  <!-- a quantum orbit with a gap; the route starts at the depot in the middle, leaves through the gap, bends and ends at a stop -->
  <path d="M33.6 43.2 A16 16 0 1 1 43.2 33.6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" />
  <path d="M28 28 L40 40 L47 40 L47 51" fill="none" stroke="#ffd166" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="28" cy="28" r="5.2" fill="#fff" />
  <circle cx="47" cy="52" r="4.8" fill="#fff" stroke="#ffd166" stroke-width="3" />
  <circle cx="16.7" cy="16.7" r="3.2" fill="#ffd166" stroke="#a52a3c" stroke-width="1.6" />
</svg>
